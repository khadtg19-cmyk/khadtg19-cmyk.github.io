function choose(i){S.fi=i;S.fruit=FR[i].n;S.pts+=10;hud();fin(board,5)}
function leave(){$('bd').remove();document.body.classList.remove('shot');menu()}
function board(){B=4;const f=FR[S.fi],pc=S.tot?Math.round(S.cor/S.tot*100):0;let d='';try{d=new Date().toLocaleDateString('ar-SA-u-ca-gregory')}catch(e){d=new Date().toISOString().slice(0,10)}
 const o=document.createElement('div');o.id='bd';o.onclick=()=>document.body.classList.remove('shot');
 o.innerHTML='<div class="card"><div class="ob">لوحة الإنجاز</div><div class="nm">'+esc(S.name)+'</div><div class="sb">أصلحت جسر الصداقة بالتسامح</div><div class="seal">سفيرة<br>التسامح</div><div class="rows"><div><b>'+S.pts+'</b>نقطة</div><div><b>'+S.cor+'/'+S.tot+'</b>إجابة صحيحة</div><div><b>'+pc+'%</b>نسبة الإنجاز</div></div><div class="rwd">'+RI.map((r,i)=>'<span>'+r+'<small>'+RW[i]+'</small></span>').join('')+'</div><div class="fr"><small>الثمرة التي لامست قلبي</small><b>'+f.n+'</b><p>'+f.d+'</p></div><div class="ft">المدرسة الابتدائية ١٩ لتحفيظ القرآن الكريم<br>فريق «بقيمنا نرتقي»<br>'+d+'</div><div class="nb"><p>التقطي لقطة شاشة وأرسليها إلى معلمتكِ.</p><button class="b" onclick="event.stopPropagation();document.body.classList.add(\'shot\')">إخفاء الأزرار للتصوير</button><button class="b s" onclick="leave()">حكاية جديدة</button></div></div>';document.body.appendChild(o)}
function quiz(l,n,i,t,nar){i=i||0;if(i>=l.length)return n();const q=l[i];window.Q={l,n,i,t:t||(window.Q&&window.Q.t),d:0};
 show(bar()+'<h3>'+Q.t+' ('+(i+1)+'/'+l.length+')</h3><p>'+q.q+'</p>'+q.o.map((o,k)=>'<button class="b o" onclick="ans('+k+')">'+o+'</button>').join('')+'<div id="ex"></div>',i?'':nar);say(q.q,i?0:1)}
function ans(k){if(Q.d)return;Q.d=1;const q=Q.l[Q.i],ok=k==q.a,bs=P.querySelectorAll('.o');S.tot++;bs[q.a].classList.add('g');
 if(ok){S.cor++;S.pts+=10;chime([523,659,784])}else bs[k].classList.add('x');hud();
 $('ex').innerHTML='<p><b>'+(ok?'أحسنتِ! ':'ليست الإجابة الصحيحة. ')+'</b>'+q.e+'</p><button class="b" onclick="quiz(Q.l,Q.n,Q.i+1)">التالي</button>';say((ok?'أحسنتِ! ':'لا بأس. ')+q.e)}
function teacher(){let a=[];try{a=JSON.parse(localStorage.getItem('ld')||'[]')}catch(e){}
 const csv='الاسم,النقاط,المراحل المكتملة,الإجابات الصحيحة,عدد الأسئلة,نسبة الإنجاز,اللقب,الثمرة,التاريخ\n'+a.map(r=>[nc(r.n),r.p,r.s,r.c,r.t,r.s*20+'%',r.ti,nc(r.f||''),r.d].join(',')).join('\n');
 show('<h3>لوحة المعلمة</h3><div class="tw"><table><tr><th>الاسم</th><th>النقاط</th><th>المراحل</th><th>صحيحة</th><th>الإنجاز</th><th>اللقب</th><th>الثمرة</th></tr>'+(a.map(r=>'<tr><td>'+esc(r.n)+'</td><td>'+r.p+'</td><td>'+r.s+'/5</td><td>'+r.c+'/'+r.t+'</td><td>'+r.s*20+'%</td><td>'+r.ti+'</td><td>'+esc(r.f||'')+'</td></tr>').join('')||'<tr><td colspan="7">لا توجد نتائج بعد.</td></tr>')+'</table></div><p>النتائج محفوظة في هذا الجهاز. انسخي ملف CSV وافتحيه في Excel.</p><textarea id="cv" readonly>'+esc(csv)+'</textarea><button class="b" onclick="cpy()">نسخ CSV</button><button class="b s" onclick="menu()">رجوع</button>')}
function cpy(){const t=$('cv');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('تم النسخ')}
hud();menu();
</script>
