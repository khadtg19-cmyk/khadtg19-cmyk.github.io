<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحققة الصغيرة: قضية قلب مجروح</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#DFF5F1;--tx:#3A2236;--pn:#FFFAF2;--ac:#17766C;--ab:#fff;--pk:#F4B6CF;--gd:#D9A93B;--ok:#CDEFD6;--no:#F9D3D3;--bd:#E4D3BF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10302D;--tx:#F6EBF2;--pn:#241A26;--ac:#3FB9AA;--ab:#0B2B27;--ok:#1F4A36;--no:#5A2A2E;--bd:#4A3A4C}}
:root[data-theme=dark]{--bg:#10302D;--tx:#F6EBF2;--pn:#241A26;--ac:#3FB9AA;--ab:#0B2B27;--ok:#1F4A36;--no:#5A2A2E;--bd:#4A3A4C}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#top b{background:var(--pn);border:2px solid var(--bd);border-radius:20px;padding:2px 12px;font-size:15px}
#top button{margin-inline-start:auto}
#top button+button{margin-inline-start:0}
.i{min-width:44px;min-height:44px;border-radius:22px;border:2px solid var(--bd);background:var(--pn);color:var(--tx);font:700 14px Cairo,sans-serif;padding:0 12px}
#bt{position:fixed;bottom:0;left:0;right:0;max-height:62vh;display:flex;flex-direction:column;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
#bub{align-self:flex-start;max-width:92%;background:var(--pk);color:#3A2236;border-radius:18px 18px 18px 4px;padding:8px 14px;font-size:16px;font-weight:700;line-height:1.6}
#p{background:var(--pn);border:2px solid var(--bd);border-radius:22px;padding:14px 16px;overflow:auto;font-size:17px;line-height:1.8}
h2,h3{margin:0 0 6px;color:var(--ac)}h2{font-size:26px;font-weight:900}h3{font-size:20px}p{margin:4px 0 8px}
.b{display:block;width:100%;min-height:48px;margin:8px 0;padding:8px 14px;border-radius:14px;border:2px solid var(--ac);background:var(--ac);color:var(--ab);font:700 17px Cairo,sans-serif;text-align:start}
.b.s,.b.o{background:var(--pn);color:var(--tx);border-color:var(--bd)}
.b.g{background:var(--ok);border-color:#2E9B57;color:var(--tx)}.b.x{background:var(--no);border-color:#C25555;color:var(--tx)}
input,textarea{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--bd);background:var(--pn);color:var(--tx);font:17px Cairo,sans-serif;padding:8px 12px}
textarea{min-height:90px;direction:ltr}
.v{background:var(--bg);border-radius:14px;padding:10px 14px;font-size:20px;line-height:2;text-align:center}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:4px 8px;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--bd);margin-bottom:8px}.bar i{display:block;height:100%;border-radius:4px;background:var(--gd)}
#pz{position:fixed;inset:0;background:rgba(20,10,25,.7);display:none;place-items:center;z-index:5}
#pz div{background:var(--pn);padding:24px;border-radius:22px;width:min(320px,86%)}
#ts{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:var(--gd);color:#2A1B00;font-weight:900;padding:10px 22px;border-radius:24px;display:none;z-index:4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><b>النقاط <span id="pts">0</span></b><b id="rw">—</b><button class="i" id="bs" onclick="snd()">الصوت: تشغيل</button><button class="i" onclick="say(S.last)">أعيدي الكلام</button><button class="i" onclick="pz(1)">إيقاف</button></div>
<div id="ts"></div>
<div id="bt"><div id="bub"></div><div id="p"></div></div>
<div id="pz"><div><h3>اللعبة متوقفة</h3><button class="b" onclick="pz(0)">استكملي اللعب</button><button class="b s" onclick="pz(0);menu()">القائمة الرئيسية</button></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"',]/g,c=>c==','?'،':'&#'+c.charCodeAt()+';');
const S={name:'',pts:0,cor:0,tot:0,done:0,sound:true,last:'',stage:0,o:0};
const RW=['مفتاح الأدلة','جوهرة العفو','نجمة الاحترام','مفتاح المصالحة','وسام سفيرة التسامح'],RI=['🔑','💎','⭐','🗝️','🏅'];
/* ---------- 3D ---------- */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.shadowMap.enabled=true;
const sc=new THREE.Scene();sc.background=new THREE.Color(0xdff5f1);
const cam=new THREE.PerspectiveCamera(45,1,.1,60);
sc.add(new THREE.HemisphereLight(0xffffff,0xf4d9c6,.85));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,7,6);dl.castShadow=true;sc.add(dl);
const M=(c,e)=>new THREE.MeshStandardMaterial({color:c,roughness:.7,emissive:e||0});
const box=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.receiveShadow=true;sc.add(m);return m};
box(24,.2,16,0xf3e3cc,0,-.1,0);box(24,9,.2,0x7fd3c8,0,4.4,-4.2);box(3,2,.1,0xfff7e8,-3.2,4,-4.05);box(2.4,1.6,.1,0xf4b6cf,3.4,3.6,-4.05);
box(5,.12,1.3,0xc8956a,0,.9,-1.8);box(.15,.9,.15,0xa87650,-2.3,.45,-1.8);box(.15,.9,.15,0xa87650,2.3,.45,-1.8);
box(.7,.08,.5,0xe96aa0,-1.3,1,-1.8);box(.7,.03,.5,0xffffff,1.3,.97,-1.8);
const gs=[];let tk=null;
function girl(col,hair,x,z,hat){
 const g=new THREE.Group(),sp=(r,c,y)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),M(c));m.position.y=y;m.castShadow=true;return m};
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.42,.72,1.3,20),M(col));b.position.y=.65;b.castShadow=true;
 const h=new THREE.Group();h.position.y=1.75;h.add(sp(.5,0xffdcc2,0));
 const hr=sp(.54,hair,.06);hr.scale.set(1,1,.9);hr.position.z=-.07;h.add(hr);
 const eyes=[-1,1].map(s=>{const e=sp(.07,0x2a1a22,.05);e.position.set(s*.18,.05,.46);h.add(e);return e});
 const ch=[-1,1].map(s=>{const e=sp(.08,0xf59ab5,-.1);e.position.set(s*.28,-.1,.42);e.scale.z=.3;h.add(e)});
 const mo=new THREE.Mesh(new THREE.BoxGeometry(.2,.05,.05),M(0xc2405e));mo.position.set(0,-.2,.49);h.add(mo);
 if(hat){const c=new THREE.Mesh(new THREE.ConeGeometry(.42,.4,20),M(0xb08968));c.position.y=.58;const br=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.05,24),M(0x8d6e4f));br.position.y=.4;h.add(c,br);
  const mg=new THREE.Mesh(new THREE.TorusGeometry(.24,.05,10,24),M(0xd9a93b));mg.position.set(.75,1.1,.5);const hd=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.5,8),M(0x8d6e4f));hd.position.set(.75,.75,.5);hd.rotation.z=.5;g.add(mg,hd);
  const bg=new THREE.Mesh(new THREE.BoxGeometry(.4,.45,.18),M(0xf4a0c4));bg.position.set(-.55,.8,-.2);g.add(bg)}
 g.add(b,h);g.position.set(x,0,z);g.rotation.y=-x*.1;g.userData={h,m:mo,e:eyes,j:0,s:0};sc.add(g);gs.push(g);return g}
const L=girl(0x2bb5a6,0x5a3a2a,-2,2.6,1),SA=girl(0xf4b6cf,0x2a1a22,-1.5,-.2),RE=girl(0xcdb4f0,0x7a4a2a,0,-.4),NO=girl(0xf6d48a,0x1a1218,1.5,-.2);
NO.rotation.y=.5;SA.rotation.y=-.5;
const cl=[[-1.3,1.6,-1.8,'دفتر المشروع: كتبت سارة فكرة تزيين لوحة الفصل، لكنها لم تذكر نورة فيه ولم تسألها عن رأيها.',L],
[1.3,1.6,-1.8,'ورقة الفكرة: فيها رسم جميل من نورة، لكنه لم يُعرض على أحد.',L],
[0,2.9,-.4,'شهادة ريم: سارة لم تقصد تجاهل نورة، كانت مستعجلة. ونورة حزنت لأن رأيها لم يُسمع.',RE],
[0,3.6,-.2,'حوار الصديقتين. سارة: لم أنتبه إلى رسمك. نورة: ظننتك لا تريدين رأيي.',SA]]
.map(a=>{const m=new THREE.Mesh(new THREE.OctahedronGeometry(.22),M(0xd9a93b,0x8a6212));m.position.set(a[0],a[1],a[2]);m.userData={y:a[1],t:a[3],w:a[4],f:0};sc.add(m);return m});
const conf=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({size:.12,color:0xd9a93b}));
const cp0=new Float32Array(600);for(let i=0;i<600;i++)cp0[i]=(Math.random()-.5)*(i%3==1?6:8);conf.geometry.setAttribute('position',new THREE.BufferAttribute(cp0,3));conf.visible=false;sc.add(conf);
let ang=0,ca=0,paused=false,T0=0;
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
function lp(t){requestAnimationFrame(lp);if(paused)return;t*=.001;const dt=Math.min(t-T0,.1);T0=t;
 gs.forEach((g,i)=>{const u=g.userData;g.position.y=Math.abs(Math.sin(t*1.5+i))*.03+(u.j>0?Math.sin(u.j*3.14)*.6:0);u.j=Math.max(0,u.j-dt*1.6);u.h.rotation.z=u.s>0?Math.sin(u.s*25)*.2:0;u.s=Math.max(0,u.s-dt*1.5);
  u.m.scale.y=tk===g?.6+Math.abs(Math.sin(t*14))*2.6:1;const bl=(t+i)%3.2<.12;u.e.forEach(e=>e.scale.y=bl?.1:1)});
 cl.forEach((c,i)=>{c.rotation.y=t*2;c.position.y=c.userData.y+Math.sin(t*2+i)*.08});
 if(conf.visible){const a=conf.geometry.attributes.position;for(let i=1;i<600;i+=3){a.array[i]-=dt*2;if(a.array[i]<0)a.array[i]=7}a.needsUpdate=true}
 ca+=(ang-ca)*.1;const asp=cam.aspect,d=asp<1?15.5:10.5;cam.position.set(Math.sin(ca)*d,asp<1?4.8:4,Math.cos(ca)*d);cam.lookAt(0,asp<1?.4:.8,0);R.render(sc,cam)}
requestAnimationFrame(lp);
const cv=$('c');let dr=0,sx=0,mv=0;
cv.onpointerdown=e=>{dr=1;sx=e.clientX;mv=0};
cv.onpointermove=e=>{if(dr){const d=e.clientX-sx;mv+=Math.abs(d);ang=Math.max(-.7,Math.min(.7,ang+d*.004));sx=e.clientX}};
cv.onpointerup=e=>{dr=0;if(mv<8&&S.stage==1)hit(e)};
function hit(e){const r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
 const h=r.intersectObjects(cl.filter(c=>c.visible),false)[0];if(!h)return;const c=h.object;c.visible=false;c.userData.f=1;beep([660,880]);say(c.userData.t,c.userData.w);
 P.insertAdjacentHTML('beforeend','<p>• '+c.userData.t+'</p>');const n=cl.filter(x=>x.userData.f).length;$('fc').textContent=n;
 if(n==4)P.insertAdjacentHTML('beforeend','<button class="b" onclick="quiz(Q1,()=>fin(s2))">انتقلي إلى التحدي</button>')}
/* ---------- صوت وكلام ---------- */
let ac;function beep(f){if(!S.sound)return;try{ac=ac||new AudioContext();f.forEach((q,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.frequency.value=q;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)})}catch(e){}}
function stopT(){tk=null;try{speechSynthesis.cancel()}catch(e){}}
function say(t,w){w=w||L;S.last=t;$('bub').textContent=t;stopT();tk=w;const k=setTimeout(()=>{if(tk==w)tk=null},Math.min(t.length*70,8000));
 if(S.sound&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.pitch=1.6;u.rate=.9;u.onend=u.onerror=()=>{clearTimeout(k);if(tk==w)tk=null};speechSynthesis.speak(u)}}
function snd(){S.sound=!S.sound;if(!S.sound)stopT();$('bs').textContent='الصوت: '+(S.sound?'تشغيل':'إيقاف')}
function pz(v){paused=!!v;$('pz').style.display=v?'grid':'none';if(v)stopT()}
/* ---------- واجهة ولعب ---------- */
const P=$('p');function show(h){P.innerHTML=h;P.scrollTop=0}
function hud(){$('pts').textContent=S.pts;$('rw').textContent=S.done?RI.slice(0,S.done).join(' '):'—'}
function toast(t){const e=$('ts');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
const bar=()=>'<div class="bar"><i style="width:'+S.stage*20+'%"></i></div>';
function save(){try{const a=JSON.parse(localStorage.getItem('ld')||'[]'),r={n:S.name,p:S.pts,s:S.done,c:S.cor,t:S.tot,d:new Date().toISOString().slice(0,10),ti:S.done>4?'سفيرة التسامح':'محققة صغيرة'},i=a.findIndex(x=>x.n==S.name);i<0?a.push(r):a[i]=r;localStorage.setItem('ld',JSON.stringify(a))}catch(e){}}
function fin(next){S.done=S.stage;hud();beep([523,659,784,1046]);toast('حصلتِ على '+RW[S.done-1]);gs.forEach(g=>g.userData.j=1);save();next()}
function menu(){S.stage=0;cl.forEach(c=>c.visible=false);conf.visible=false;show('<h2>المحققة الصغيرة: قضية قلب مجروح</h2><p>ثلاث صديقات اختلفن في المدرسة. هل تساعدين المحققة ليان على إعادة المحبة بينهن؟</p><input id="nm" placeholder="اكتبي اسمك هنا" maxlength="30"><button class="b" onclick="begin()">ابدئي التحقيق</button><button class="b s" onclick="teacher()">وضع المعلمة</button>');say('مرحبًا بكِ! أنا المحققة ليان. عندي قضية تحتاج إلى مساعدتك.')}
function begin(){const n=$('nm').value.trim();if(!n){$('nm').focus();return}Object.assign(S,{name:n,pts:0,cor:0,tot:0,done:0});hud();s1()}
const Q1=[{q:'ما أول خطوة عادلة تقوم بها المحققة؟',o:['أنحاز إلى سارة فورًا','أستمع إلى الطرفين بهدوء','أترك الصديقتين وأمضي'],a:1,e:'العدل يبدأ بالاستماع إلى الطرفين قبل الحكم.'}];
const Q2=[{q:'ما الفرق بين التسامح والضعف؟',o:['لا فرق بينهما','التسامح قرار الواثقة بنفسها، والضعف خوف من المواجهة','التسامح أن أسكت عن كل أذى'],a:1,e:'التسامح قوة، لأنه يحتاج إلى ضبط النفس.'},
{q:'هل يعني العفو قبول الظلم؟',o:['نعم، دائمًا','لا، أعفو وأحمي نفسي بالطريقة الصحيحة','لا، بل أردّ الأذى بمثله'],a:1,e:'العفو لا يعني قبول الظلم أو تكراره.'}];
const Q3=[{q:'اختلفت معك زميلتك في الرأي. كيف تتصرفين؟',o:['أقاطعها','أحترم رأيها وأعرض رأيي بلطف','أرفع صوتي'],a:1,e:'الاختلاف طبيعي، والاحترام يحفظ الصداقة.'},
{q:'اعتذرت إليك صديقتك. ماذا تفعلين؟',o:['أقبل اعتذارها وأعفو','أتجاهلها','أنتظر اعتذارًا ثانيًا'],a:0,e:'قبول الاعتذار خلق كريم.'},
{q:'شاهدتِ طالبة تسخر من زميلتها. ماذا تفعلين؟',o:['أضحك معها','أنصحها بلطف وأقف مع زميلتي','أتجاهل الموقف'],a:1,e:'نصرة المظلومة بالحكمة من الأخلاق الحسنة.'},
{q:'تكرر الأذى وصرتِ تشعرين بعدم الأمان. ما التصرف المناسب؟',o:['أسكت وأتحمل','أخبر معلمتي أو والدتي ليحموني','أردّ بالأذى'],a:1,e:'التسامح لا يمنع طلب الحماية من الكبار.'}];
const ST=['الاستماع بهدوء إلى كل صديقة','توضيح ما حدث والاعتراف بالخطأ','الاعتذار بصدق وقبول الاعتذار','الاتفاق على التعاون واحترام الآراء مستقبلًا'];
const Q5=[{q:'ماذا يأمر قوله تعالى «وليعفوا وليصفحوا»؟',o:['بالعفو والصفح','بالغضب','بالقطيعة'],a:0,e:'الآية تدعو إلى العفو والصفح رجاء مغفرة الله.'},
{q:'رفضت صديقتك رأيك ثم اعتذرت. ما القرار الأفضل؟',o:['أعفو وأعيد التعاون معها','أقاطعها أسبوعًا'],a:0,e:'العفو يعيد الود ويرفع صاحبه.'},
{q:'أي حل ينهي خلاف سارة ونورة؟',o:['أن تتحدثا بهدوء وتعتذرا وتتعاونا','أن تتجنب كل منهما الأخرى','أن تختار ريم بينهما'],a:0,e:'الحوار والاعتذار والتعاون هي طريق الصلح.'}];
function s1(){S.stage=1;cl.forEach(c=>{c.visible=true;c.userData.f=0});show(bar()+'<h3>المرحلة ١: جمع الأدلة</h3><p>انقري على النجوم الذهبية في المشهد، ويمكنك تدوير الكاميرا بالسحب. الأدلة: <b id="fc">0</b> من ٤</p>');say('اضغطي على النجوم الذهبية لنكتشف الأدلة معًا.')}
function s2(){S.stage=2;show(bar()+'<h3>المرحلة ٢: فهم التسامح</h3><p>التسامح أن تعفو وتصفحي عمّن أخطأ في حقك طلبًا للمحبة ورضا الله. وهو قوة لا ضعف، ولا يعني قبول الظلم.</p><div class="v">﴿وَلْيَعْفُوا وَلْيَصْفَحُوا ۗ أَلَا تُحِبُّونَ أَنْ يَغْفِرَ اللَّهُ لَكُمْ﴾ [النور: ٢٢]</div><div class="v">قال رسول الله ﷺ: «وما زاد الله عبدًا بعفوٍ إلا عزًّا». رواه مسلم.</div><button class="b" onclick="quiz(Q2,()=>fin(s3))">ابدئي التحدي</button>');say('التسامح قوة لا ضعف. اقرئي الآية والحديث، ثم أجيبي عن السؤالين.')}
function s3(){S.stage=3;quiz(Q3,()=>fin(s4),0,'المرحلة ٣: مواقف وقرارات')}
function s4(){S.stage=4;S.o=0;const sh=ST.map((t,i)=>[t,i]).sort(()=>Math.random()-.5);show(bar()+'<h3>المرحلة ٤: خطة المصالحة</h3><p>انقري على الخطوات بالترتيب الصحيح.</p><ol id="ol"></ol><div id="cd">'+sh.map(([t,i])=>'<button class="b o" onclick="pick(this,'+i+')">'+t+'</button>').join('')+'</div><p id="fb"></p>');say('رتّبي خطوات المصالحة من الأولى إلى الأخيرة.')}
function pick(b,i){if(i==S.o){beep([660]);$('ol').insertAdjacentHTML('beforeend','<li>'+b.textContent+'</li>');b.remove();S.o++;$('fb').textContent='';
 if(S.o==4){S.pts+=20;S.cor++;S.tot++;hud();fin(s5)}}else{beep([200]);L.userData.s=1;$('fb').textContent='ليست هذه الخطوة الآن. جرّبي خطوة أخرى.';say('فكّري في ما يأتي أولًا.')}}
function s5(){S.stage=5;quiz(Q5,end,0,'المرحلة ٥: القرار الأخير')}
function end(){S.done=5;hud();save();conf.visible=true;gs.forEach(g=>g.userData.j=1);beep([523,659,784,1046,1318]);const pc=S.tot?Math.round(S.cor/S.tot*100):0;
 show('<h2>أحسنتِ يا '+esc(S.name)+'!</h2><p>عادت المحبة بين الصديقات، وصرتِ <b>سفيرة التسامح</b>.</p><p>النقاط: '+S.pts+' | الإجابات الصحيحة: '+S.cor+' من '+S.tot+' ('+pc+'%)</p><button class="b" onclick="menu()">لعب جديد</button>');say('مبروك! أصبحتِ سفيرة التسامح. لقد أعدتِ المحبة إلى القلوب.')}
function quiz(l,n,i,t){i=i||0;if(i>=l.length)return n();const q=l[i];window.Q={l,n,i,t:t||(window.Q&&window.Q.t),d:0};
 show(bar()+'<h3>'+(Q.t||'تحدي')+' ('+(i+1)+'/'+l.length+')</h3><p>'+q.q+'</p>'+q.o.map((o,k)=>'<button class="b o" onclick="ans('+k+')">'+o+'</button>').join('')+'<div id="ex"></div>');say(q.q)}
function ans(k){if(Q.d)return;Q.d=1;const q=Q.l[Q.i],ok=k==q.a,bs=P.querySelectorAll('.o');S.tot++;bs[q.a].classList.add('g');
 if(ok){S.cor++;S.pts+=10;beep([523,659,784]);L.userData.j=1}else{bs[k].classList.add('x');beep([200]);L.userData.s=1}hud();
 $('ex').innerHTML='<p><b>'+(ok?'أحسنتِ! ':'ليست الإجابة الصحيحة. ')+'</b>'+q.e+'</p><button class="b" onclick="quiz(Q.l,Q.n,Q.i+1)">التالي</button>';say((ok?'أحسنتِ! ':'لا بأس. ')+q.e)}
function teacher(){let a=[];try{a=JSON.parse(localStorage.getItem('ld')||'[]')}catch(e){}
 const csv='الاسم,النقاط,المراحل المكتملة,الإجابات الصحيحة,عدد الأسئلة,نسبة الإنجاز,اللقب,التاريخ\n'+a.map(r=>[esc(r.n).replace(/&#(\d+);/g,(m,c)=>String.fromCharCode(c)),r.p,r.s,r.c,r.t,r.s*20+'%',r.ti,r.d].join(',')).join('\n');
 show('<h3>لوحة المعلمة</h3><div class="tw"><table><tr><th>الاسم</th><th>النقاط</th><th>المراحل</th><th>صحيحة</th><th>الإنجاز</th><th>اللقب</th></tr>'+(a.map(r=>'<tr><td>'+esc(r.n)+'</td><td>'+r.p+'</td><td>'+r.s+'/5</td><td>'+r.c+'/'+r.t+'</td><td>'+r.s*20+'%</td><td>'+r.ti+'</td></tr>').join('')||'<tr><td colspan="6">لا توجد نتائج بعد.</td></tr>')+'</table></div><p>النتائج محفوظة في هذا الجهاز. انسخي ملف CSV وافتحيه في Excel.</p><textarea id="cv" readonly>'+csv.replace(/</g,'&lt;')+'</textarea><button class="b" onclick="cpy()">نسخ CSV</button><button class="b s" onclick="menu()">رجوع</button>');say('هذه لوحة المعلمة لمتابعة إنجاز الطالبات.')}
function cpy(){const t=$('cv');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('تم النسخ')}
hud();menu();
