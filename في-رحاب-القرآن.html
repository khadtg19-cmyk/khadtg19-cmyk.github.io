<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>في رحاب القرآن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: classroom game board — a hub of game cards, one game stage at a time, and a results board for the teacher */
:root{
  --paper:#FBF3E6; --card:#FFFDF8; --ink:#1F3B4D; --muted:#6a5a3f; --line:#D9C7A5;
  --teal:#3E7F88; --teal-soft:#DDEEEC; --coral:#E07A5F; --gold:#F2B84B; --leaf:#5E8E3E; --leaf-soft:#EAF3E0; --rose-soft:#FBE9E4;
  --f-ui:'Tajawal',system-ui,sans-serif; --f-q:'Amiri Quran','Amiri','Traditional Arabic',serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1100px;margin:0 auto}
.board{position:relative;background:linear-gradient(180deg,#FDF6EA,#F5E6CF);border:2px solid #EADBC0;border-radius:28px;padding:clamp(14px,2.6vw,28px);overflow:hidden;box-shadow:0 10px 30px rgba(120,90,40,.12)}
.deco{position:absolute;pointer-events:none}
header.hd{position:relative;padding-inline:8px 64px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.school{font-size:.82rem;font-weight:700;color:var(--teal)}
.who{display:flex;align-items:center;gap:8px;background:#fff;border:2px dashed var(--line);border-radius:40px;padding:6px 14px}
.who label{font-weight:800;white-space:nowrap;font-size:.92rem}
.who.ayah{font-family:var(--f-q);font-size:1.15rem;line-height:1.9;color:#12324a;padding:4px 18px}
.who input{border:0;border-bottom:2px dotted var(--ink);background:transparent;font:700 .95rem var(--f-ui);color:var(--ink);width:170px;max-width:46vw;padding:2px}
.who input:focus{outline:none;border-bottom-color:var(--coral)}
.cloud{position:relative;margin:14px auto 6px;max-width:640px;background:var(--card);border:2.5px dashed var(--line);border-radius:60px;padding:14px 20px;text-align:center}
.cloud small{font-weight:800;color:var(--teal)}
.cloud h1{margin:.15em 0 0;font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800;line-height:1.3;text-wrap:balance}
.cloud h1 b{color:var(--coral)}
.cloud p{margin:.3em 0 0;color:var(--muted);font-weight:500;font-size:.92rem}
.hub{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:1fr;gap:14px;margin-top:16px}
.hub .gcard{height:100%}
.gcard{position:relative;text-align:right;background:var(--card);border:2px solid #EADBC0;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s}
.gcard:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(120,90,40,.14)}
.gcard:focus-visible,button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.gic{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c)}
.gic svg{width:34px;height:34px}
.gcard .gt{display:block;margin:0;font-size:1.05rem;font-weight:800}
.gcard .gd{display:block;margin:.25em 0 0;font-size:.84rem;color:var(--muted);font-weight:500;line-height:1.5}
.skill{display:inline-block;margin-top:6px;font-size:.74rem;font-weight:800;color:var(--c2);background:var(--c);border-radius:10px;padding:1px 9px}
.stars{position:absolute;top:10px;left:12px;color:var(--gold);font-size:.95rem;letter-spacing:1px}
.stage{position:relative;margin-top:16px;background:var(--card);border:2.5px dashed var(--line);border-radius:26px;padding:clamp(14px,2.4vw,24px)}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stage-top h2{margin:0;font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:10px}
.prog{display:flex;gap:4px}
.prog i{width:22px;height:8px;border-radius:6px;background:#EADBC0}
.prog i.ok{background:var(--leaf)}.prog i.no{background:var(--coral)}.prog i.cur{background:var(--gold)}
.back{background:var(--teal-soft);color:var(--teal)}
button{font:800 1rem var(--f-ui);border:0;border-radius:40px;padding:10px 22px;cursor:pointer;color:var(--ink)}
.primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 #b95a42}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #b95a42}
.how{margin:10px 0 0;font-size:.92rem;font-weight:700;color:var(--muted)}
.qbox{margin-top:16px;text-align:center}
.prompt{font-size:1.1rem;font-weight:800;line-height:1.7;text-wrap:balance}
.big{font-family:var(--f-q);font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.6;color:#12324a;margin:.1em 0}
.verse{font-family:var(--f-q);font-size:clamp(1.3rem,3vw,1.75rem);line-height:2;color:#12324a}
.verse mark{background:#FCE9A8;border-radius:8px;padding:0 4px;color:inherit}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.opt{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:12px 20px;font-size:1.05rem;min-width:120px}
.opt.wide{flex:1 1 100%;max-width:560px;text-align:right;font-weight:700;line-height:1.6}
.opt.q{font-family:var(--f-q);font-weight:400;font-size:1.5rem;padding:6px 20px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf);color:#2f5a1c}
.opt.wrong{background:var(--rose-soft);border-color:var(--coral)}
.opt:disabled{cursor:default}
.sunmoon{display:flex;gap:16px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.sunmoon .opt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:150px}
.sunmoon svg{width:56px;height:56px}
.tiles .opt{font-family:var(--f-q);font-size:2rem;min-width:90px;padding:4px 18px}
.feedback{min-height:3.2em;margin-top:14px;font-weight:700;line-height:1.6;font-size:.98rem;max-width:620px;margin-inline:auto;border-radius:14px;padding:8px 12px}
.feedback.ok{background:var(--leaf-soft);color:#2f5a1c}
.feedback.no{background:#FFF4D6;color:#7a5413}
.next{margin-top:12px}
.memory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.mc{aspect-ratio:4/3;border-radius:16px;border:2.5px solid var(--line);background:linear-gradient(135deg,var(--teal),#2d636b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.6rem;padding:6px;text-align:center;line-height:1.4;max-width:100%}
.mc.open,.mc.done{background:#fff;color:var(--ink);font-size:.98rem}
.mc.open .q,.mc.done .q{font-family:var(--f-q);font-size:1.45rem;font-weight:400}
.mc.done{border-color:var(--leaf);background:var(--leaf-soft)}
.endbox{text-align:center;margin-top:18px}
.endbox .score{font-size:2.4rem;color:var(--gold);letter-spacing:4px}
.endbox p{font-weight:800;font-size:1.1rem}
.results{margin-top:16px;display:grid;gap:12px}
.rrow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center;background:#fff;border:1.5px solid #EADBC0;border-radius:16px;padding:10px 14px}
.rrow b{font-weight:800}
.bar{height:14px;border-radius:10px;background:#F1E6D2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--teal),var(--leaf))}
.lvl{font-size:.82rem;font-weight:800;text-align:center;border-radius:12px;padding:3px 6px;font-variant-numeric:tabular-nums}
.lvl.a{background:var(--leaf-soft);color:#2f5a1c}.lvl.b{background:#FFF4D6;color:#7a5413}.lvl.c{background:var(--teal-soft);color:var(--teal)}.lvl.d{background:#F1EBE0;color:var(--muted)}
.vres{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px;margin-top:18px;background:#fff;border:1.5px solid #EADBC0;border-radius:20px;padding:18px 10px 14px}
.vcol{flex:1 1 0;min-width:88px;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.vpc{font-weight:800;font-size:1rem;font-variant-numeric:tabular-nums}
.vbar{width:40px;height:190px;border-radius:14px;background:#F1E6D2;display:flex;align-items:flex-end;overflow:hidden}
.vbar i{display:block;width:100%;border-radius:14px;background:linear-gradient(0deg,var(--teal),var(--leaf));transition:height .6s}
.vcol b{font-size:.88rem;font-weight:800;line-height:1.35;min-height:2.7em;display:flex;align-items:center}
.vcol .lvl{font-size:.72rem;line-height:1.3}
@media (max-width:640px){.vres{flex-wrap:nowrap;gap:4px;padding:14px 6px 10px}.vcol{min-width:0;max-width:none;gap:4px}.vbar{height:150px;width:24px;border-radius:10px}.vbar i{border-radius:10px}.vpc{font-size:.75rem}.vcol b{font-size:.66rem;min-height:4em}.vcol .lvl{font-size:.58rem;padding:2px 3px}}
.rescard{position:relative;margin-top:14px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;background:linear-gradient(270deg,#FFFDF8,#E9F1F5);border:2px solid #C9DCE4;border-radius:22px;padding:16px 18px;box-shadow:0 6px 16px rgba(31,59,77,.08)}
.rescard .rc-main{flex:1 1 200px}
.rescard .gt{display:block;font-size:1.15rem;font-weight:800}
.rescard .gd{display:block;margin-top:.2em;font-size:.86rem;color:var(--muted);font-weight:500}
.rescard .skill{display:inline-block;margin-top:6px;font-size:.74rem;font-weight:800;border-radius:10px;padding:1px 9px}
.idcard{position:relative;flex:2 1 260px;min-width:0;max-width:100%;box-sizing:border-box;display:flex;flex-wrap:nowrap;gap:10px 14px;align-items:center;background:#fff;border:2.5px dashed var(--teal);border-radius:18px;padding:18px 16px 12px;margin-top:8px}
.idtag{position:absolute;top:-13px;right:16px;background:var(--gold);color:#5a3d06;font-weight:800;font-size:.8rem;border-radius:20px;padding:2px 12px;box-shadow:0 2px 0 #d39a2a}
.idcard label{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.95rem;white-space:nowrap;min-width:0;flex:1 1 0}
.idcard label:last-of-type{flex:none}
.idcard input{border:0;background:transparent;font:700 1rem var(--f-ui);color:var(--ink);width:100%;min-width:0;padding:2px}
.idcard input#hk{width:64px!important;flex:none}
.idcard input:focus{outline:none;border-bottom-color:var(--coral)}
.rescard #toRes{flex:none}
.idbox{display:flex;flex-wrap:nowrap;min-width:0;gap:8px 16px;align-items:center;background:#fff;border:2.5px solid var(--teal);border-radius:16px;padding:8px 14px;box-shadow:0 3px 0 var(--teal-soft)}
.idbox label{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.92rem;white-space:nowrap;min-width:0}
.idbox input{border:0;background:transparent;font:700 .95rem var(--f-ui);color:var(--ink);width:150px;max-width:34vw;min-width:0;padding:2px}
.idbox input#klass{width:56px!important}
.idbox input:focus{outline:none;border-bottom-color:var(--coral)}
.note{margin-top:10px;font-size:.86rem;color:var(--muted);font-weight:500;line-height:1.7}
.credit{position:relative;margin:18px 60px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.84rem;font-weight:700;color:var(--muted);border-top:1.5px dashed var(--line);padding-top:10px}
.credit b{color:var(--ink)}
/* Treasure map + stage themes */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 14px;margin-top:18px}
.st{position:relative;text-align:right;border:2px solid transparent;border-radius:22px;padding:16px 14px 14px;background:var(--s2);display:flex;gap:12px;align-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.06);transition:transform .15s}
.st:hover{transform:translateY(-2px);border-color:var(--s)}
.st .num{position:absolute;top:-10px;right:-6px;width:32px;height:32px;border-radius:50%;background:var(--s);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.st .gic{background:#fff;width:52px;height:52px}
.st .gt{display:block;font-weight:800;font-size:1.1rem;color:var(--s)}
.st .mech{display:inline-block;margin-top:4px;font-size:.8rem;font-weight:800;background:#fff;color:var(--s);border-radius:10px;padding:1px 9px}
.stage.th{border:3px solid var(--s);background:linear-gradient(180deg,var(--s2) 0,var(--card) 240px)}
.th .stage-top h2{color:var(--s)}
.th .stage-top .gic{background:#fff!important}
.th .back{background:#fff;color:var(--s)}
.th .primary{background:var(--s);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.th .prog i.cur{background:var(--s)}
.th .opt:hover:not(:disabled){border-color:var(--s)}
.th .mc:not(.open):not(.done){background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(0,0,0,.2)),var(--s)}
.th .verse mark{background:var(--s2);box-shadow:inset 0 -3px 0 var(--s)}
.src{font-weight:700;color:var(--muted);font-size:.85rem}
.mean{display:inline-block;margin-top:8px;background:#fff;border:2px dashed var(--s,var(--line));border-radius:16px;padding:8px 20px;font-weight:800;font-size:1.15rem}
.hint{text-align:center;font-weight:800;color:var(--s,var(--teal));margin:10px 0 0}
.balloons{gap:18px}
.balloons .opt{width:150px;min-height:124px;border:0;border-radius:50% 50% 47% 47%/58% 58% 42% 42%;background:var(--bc);box-shadow:inset -10px -12px 0 rgba(0,0,0,.07);position:relative;margin-bottom:26px;font-weight:800;line-height:1.4;padding:12px}
.balloons .opt::after{content:'';position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:#9b7a5a}
.balloons .opt.right{background:#9CCB7A;color:#1e3d10}
.balloons .opt.wrong{background:#ddd;opacity:.6}
.sh-hex .opt{clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%);border:0;background:var(--s2);padding:10px 40px;min-width:150px}
.sh-hex .opt.right{background:#CFE6BE}.sh-hex .opt.wrong{background:#F6CFC4}
.sh-leaf .opt{border-radius:30px 6px 30px 6px}
.sh-ticket .opt{border-radius:8px;border-style:dashed;border-color:var(--s);background:#FFFBEF}
.sh-ticket .opt.right{background:var(--leaf-soft);border-color:var(--leaf)}.sh-ticket .opt.wrong{background:var(--rose-soft);border-color:var(--coral)}
.tfb .opt{min-width:150px;font-size:1.25rem;font-weight:800;border-radius:24px;display:flex;align-items:center;gap:8px;justify-content:center}
.tfi{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--s2);color:var(--s)}
.ladwrap{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:16px;align-items:start}
.ladder{background:#fff;border-radius:18px;padding:8px;border:2px dashed var(--s)}
.ladder svg{display:block;width:100%;max-height:340px}
.chests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px auto 0;max-width:540px}
.chest{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:400 1.3rem var(--f-q);line-height:1.6}
.chest svg{width:72px;height:58px}
.chest.sel{border-color:var(--s);background:var(--s2)}
.chest.ok{background:#FFF6D6;border-color:#E3B341}.chest.no{background:#F1EDE7;opacity:.75}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:16px}
.conn .col{display:flex;flex-direction:column;gap:10px}
.cbtn{background:#fff;border:2.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.95rem;line-height:1.5}
.cbtn.q{font-family:var(--f-q);font-size:1.35rem;font-weight:400;padding:4px 14px}
.cbtn.sel{border-color:var(--s);background:var(--s2);box-shadow:0 0 0 3px var(--s2)}
.cbtn.done{background:var(--pc);border-color:var(--pc);cursor:default;color:var(--ink)}
.cbtn.bad{animation:shake .4s;border-color:var(--coral)}
.rail{position:relative;height:96px;margin:14px 34px 0}
.rline{position:absolute;top:30px;left:0;right:0;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#8a6a4a 0 12px,#C9B28E 12px 18px)}
.stn{position:absolute;top:18px;transform:translateX(50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;text-align:center}
.stn i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #C9B28E;font-weight:800;color:var(--muted);transition:background .4s,border-color .4s,color .4s}
.stn.done i{background:var(--s);border-color:var(--s);color:#fff}
.stn b{font-size:.74rem;font-weight:800;line-height:1.3;color:var(--ink)}
.train{position:absolute;top:-16px;transform:translateX(50%);width:64px;transition:right 1.5s cubic-bezier(.5,0,.3,1);z-index:2}
.train svg{width:64px;height:40px;display:block}
.transit .endbox{margin-top:6px}
.nextcard{display:flex;gap:12px;align-items:center;max-width:460px;margin:14px auto 0;background:var(--s2);border:2.5px solid var(--s);border-radius:20px;padding:12px 16px;animation:pop .5s 1.4s both}
.nextcard .gic{background:#fff}
.nextcard small{display:block;font-weight:800;color:var(--s)}
.nextcard b{display:block;font-size:1.2rem;font-weight:800}
.nextcard span span,.nextcard>span>span{font-size:.88rem;color:var(--muted);font-weight:700}
.tdone{text-align:center;font-weight:800;font-size:1.15rem;color:var(--s)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.aline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:68px;max-width:640px;margin:14px auto 6px;padding:10px;border:2.5px dashed var(--s);border-radius:18px;background:#fff}
.aline.ok{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft)}.aline.no{border-style:solid;border-color:var(--coral);background:var(--rose-soft)}
.ph{color:var(--muted);font-weight:700;font-size:.9rem}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;min-height:56px}
.wt{font:800 1.1rem var(--f-ui);background:var(--s2);border:2px solid var(--s);border-radius:14px;padding:2px 16px;line-height:1.6;padding-block:8px}
.aline .wt{background:#fff}
.tiles .opt{font-family:var(--f-q)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:640px){.rail{margin-inline:22px;height:64px}.stn{width:58px}.stn b{display:none}.stn i{width:28px;height:28px;font-size:.85rem}.ladwrap{grid-template-columns:minmax(0,1fr) 64px}.balloons .opt{width:130px;min-height:110px}.chests{grid-template-columns:repeat(2,minmax(0,1fr))}.conn{gap:10px 10px}.cbtn{font-size:.85rem;padding:8px 8px}.cbtn.q{font-size:1.15rem}}
@media (max-width:640px){.memory{grid-template-columns:repeat(3,minmax(0,1fr))}.rrow{grid-template-columns:1fr 76px}.rrow .bar{grid-column:1/-1;grid-row:2}.credit{margin-inline:0;margin-bottom:56px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function end(g,right,total,note){

const TRAIN='<svg viewBox="0 0 70 44" aria-hidden="true"><circle cx="54" cy="6" r="4" fill="#cbd5e1"/><circle cx="60" cy="3" r="3" fill="#e2e8f0"/><rect x="34" y="14" width="30" height="18" rx="4" fill="#2B6CB0"/><rect x="44" y="6" width="8" height="10" rx="2" fill="#1F3B4D"/><path d="M34 32V12h-12a6 6 0 0 0-6 6v14z" fill="#E07A5F"/><rect x="20" y="17" width="9" height="8" rx="2" fill="#fff"/><path d="M8 32h56" stroke="#1F3B4D" stroke-width="3"/><circle cx="24" cy="36" r="5" fill="#1F3B4D"/><circle cx="42" cy="36" r="5" fill="#1F3B4D"/><circle cx="56" cy="36" r="5" fill="#1F3B4D"/><path d="M4 30l8-6v8z" fill="#F2B84B"/></svg>';

function arrange(g){

function nextBtn(last,go){const nx=document.getElementById('nx');nx.innerHTML=`<button class="primary">${last?'عرض النتيجة':'السؤال التالي'}</button>`;nx.firstChild.onclick=go;nx.firstChild.focus()}
function ladderSVG(n,r){const H=40+n*34;let s=`<svg viewBox="0 0 90 ${H}" role="img" aria-label="الدرجات: ${AR(r)} من ${AR(n)}"><text x="45" y="12" text-anchor="middle" font-family="Tajawal,sans-serif" font-weight="800" font-size="11" fill="#9A6B12">القمّة</text><path d="M22 ${H-6}V20M68 ${H-6}V20" stroke="#9A6B12" stroke-width="5" stroke-linecap="round"/>`;

  const sy=r?H-24-(r-1)*34-16:H-12;return s+`<path transform="translate(45 ${sy})" d="M0-12l3.5 7.2 8 1.1-5.8 5.6 1.4 7.9L0 6.1l-7.1 3.7 1.4-7.9-5.8-5.6 8-1.1z" fill="#E07A5F" stroke="#fff" stroke-width="1.5"/></svg>`}
function quiz(g){

function chestSVG(s){const b=s==='no'?'#9b9184':'#8a5a2b',l=s==='no'?'#b3a99b':'#a56d35';
  return `<svg viewBox="0 0 80 64" aria-hidden="true">${s==='ok'?`<path d="M12 22c0-12 8-16 28-16s28 4 28 16z" fill="${l}" transform="rotate(-14 12 22) translate(0 -4)"/><circle cx="30" cy="30" r="7" fill="#F2B84B"/><circle cx="44" cy="27" r="7" fill="#F7CF6B"/><circle cx="53" cy="32" r="6" fill="#F2B84B"/>`:''}<path d="M12 30h56v28H12z" fill="${b}"/>${s==='ok'?'':`<path d="M12 30c0-12 8-17 28-17s28 5 28 17z" fill="${l}"/>`}<path d="M12 30h56" stroke="#F2B84B" stroke-width="4"/><rect x="35" y="26" width="10" height="13" rx="2" fill="${s==='no'?'#7d746a':'#F2B84B'}"/></svg>`}
function chests(g){

function connect(g){

  document.getElementById('back').onclick=backFn(g);
  const pr=()=>{document.getElementById('prog').innerHTML=`<span style="font-weight:800;font-size:.9rem">وصّلتِ ${AR(done)} من ${AR(P.length)}</span>`};pr();

  });

function results(){
  const name='';

  const lvl=p=>p===null?['d','لم تُلعب بعد']:p>=.9?['a','متمكّنة']:p>=.6?['b','في طريقها للإتقان']:['c','تحتاج إلى مراجعة'];
